<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exact Upload Date settings</title>
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>
<body>
  <h1>Exact Upload Date settings</h1>
  <label for="date-format">Date format</label>
  <select id="date-format">
    <option value="classic">Sept. 22 2026</option>
    <option value="iso">2026-09-22</option>
    <option value="locale">Browser language</option>
  </select>
  <p id="preview" aria-live="polite"></p>
  <label for="display-mode">Date display</label>
  <select id="display-mode">
    <option value="exact">Exact date only</option>
    <option value="both">Exact and relative dates</option>
  </select>
</body>
</html>
