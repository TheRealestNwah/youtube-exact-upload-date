<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube video date status</title>
  <link rel="stylesheet" href="status.css">
  <script src="status.js" defer></script>
</head>
<body>
  <h1>Video date status</h1>
  <p id="summary" role="status">Checking the active tab…</p>
  <label for="report">Local diagnostic report</label>
  <textarea id="report" rows="20" readonly spellcheck="false"></textarea>
  <button id="refresh" type="button">Refresh status</button>
  <button id="retry" type="button" disabled>Retry failed dates</button>
  <p>No browsing history, video IDs, URLs, or cookies are included. Nothing is sent anywhere. You can select and copy this report.</p>
</body>
</html>
