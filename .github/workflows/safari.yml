name: Safari

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Convert and build the Safari app
        run: node scripts/build-safari.mjs --xcode

      - name: Upload Safari app
        uses: actions/upload-artifact@v4
        with:
          name: safari-app
          path: dist/safari/*.zip
          if-no-files-found: error

  attach-to-release:
    if: github.event_name == 'release'
    needs: safari
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Safari app
        uses: actions/download-artifact@v4
        with:
          name: safari-app

      - name: Attach Safari app to the release
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.zip --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
