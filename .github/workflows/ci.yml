name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and extension lint
        run: npm run check

      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1

      - name: Test content script in Firefox with a cookie-requiring fixture
        run: npm run test:firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}

