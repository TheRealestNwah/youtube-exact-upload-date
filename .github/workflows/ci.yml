name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and extension lint
        run: npm run check

      - name: Build browser packages
        run: |
          npm run build
          npm run build:chromium
          npm run build:safari

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test the Chromium extension
        run: npm run test:chromium

      - name: Upload Firefox and Chromium packages
        uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: |
            web-ext-artifacts/*.zip
            dist/chromium/*.zip
          if-no-files-found: error

      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1

      - name: Test content script in Firefox with a cookie-requiring fixture
        run: npm run test:firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}

